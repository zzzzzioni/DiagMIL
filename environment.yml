# DiagMIL: train.py, eval.py, preprocess_graph_v2.py
# (Patch DINO extraction uses a separate stack: OpenSlide, transformers, etc.)

name: diagmil
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu118

      # --- direct imports in this repo ---
      - numpy==2.2.6
      - scipy==1.15.3
      - scikit-learn==1.7.2
      - networkx==3.3
      - tqdm==4.67.1
      - torch==2.7.1+cu118

      # --- scikit-learn ---
      - joblib==1.5.2
      - threadpoolctl==3.6.0

      # --- PyTorch (CUDA 11.8) ---
      - filelock==3.19.1
      - fsspec==2025.12.0
      - jinja2==3.1.6
      - markupsafe==3.0.3
      - mpmath==1.3.0
      - sympy==1.14.0
      - triton==3.3.1
      - typing-extensions>=4.10
      - nvidia-cublas-cu11==11.11.3.6
      - nvidia-cuda-cupti-cu11==11.8.87
      - nvidia-cuda-nvrtc-cu11==11.8.89
      - nvidia-cuda-runtime-cu11==11.8.89
      - nvidia-cudnn-cu11==9.1.0.70
      - nvidia-cufft-cu11==10.9.0.58
      - nvidia-curand-cu11==10.3.0.86
      - nvidia-cusolver-cu11==11.4.1.48
      - nvidia-cusparse-cu11==11.7.5.86
      - nvidia-nccl-cu11==2.21.5
      - nvidia-nvtx-cu11==11.8.86
